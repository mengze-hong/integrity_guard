name: CI — Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov pip-audit

      - name: Lint with ruff
        run: ruff check app/ tests/ --select E,F,W --ignore E501

      - name: Check frontend JavaScript syntax
        run: node scripts/check-inline-js.mjs

      - name: Test frontend helpers
        run: npm run test:js

      - name: No Cloudflare policy scan
        run: |
          if git grep --untracked -n -i -E 'cloudflared|trycloudflare|cloudflare' -- . ':!.cursor/**' ':!.git/**' ':!.github/workflows/ci.yml' ':!CHANGELOG.md' ':!data/**' ':!uploads/**' ':!screenshots/**' ':!screenshots_new/**' ':!.playwright-mcp/**'; then
            echo "Forbidden tunnel provider pattern found"
            exit 1
          else
            echo "No forbidden tunnel provider pattern found"
          fi

      - name: Secret scan
        run: npm run scan:secrets

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Run tests
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=20
