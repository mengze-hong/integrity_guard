# Deployment overlay for the public demo (Kingsoft Cloud CentOS 7).
#
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --build
#
# Differences from the base compose:
#   * binds host port 8093 (public) -> container 8000, so reviewers reach
#     the app at http://<server-ip>:8093/. The docker daemon (root) binds
#     the host port, so the unprivileged `app` user can do this via docker.
#   * loads .env from disk (kept on the host, never in git/image)
#   * restart: always so the demo survives reboots
#   * bounded json-file logs so the host disk does not fill up
#
# BYOK: the server needs NO LLM key — each user brings their own via the
# in-app "AI Settings" dialog. Leave LLM_* blank in .env.

services:
  integrityguard:
    env_file:
      - .env
    ports:
      - "8093:8000"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
